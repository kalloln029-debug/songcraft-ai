<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#05070f">
    <meta name="description" content="Turn any feeling into a song-ready blueprint.">
    <title>Sign in | Songcraft AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <script src="/firebase-config.js"></script>
    <script type="module" src="/auth.js"></script>
  </head>
  <body class="login-page">
    <div class="aurora aurora-one" aria-hidden="true"></div>
    <div class="aurora aurora-two" aria-hidden="true"></div>
    <main class="login-shell">
      <section class="login-card" aria-labelledby="login-title">
        <div class="brand-mark" aria-hidden="true">♪</div>
        <p class="eyebrow">YOUR NEXT SONG STARTS HERE</p>
        <h1 id="login-title" class="brand-title">SONGCRAFT <span>AI</span></h1>
        <p class="login-tagline">Turn any feeling into a song-ready blueprint.</p>
        <div class="login-divider"><span>ENTER THE STUDIO</span></div>
        <div class="auth-buttons">
          <button class="auth-button" id="googleBtn" type="button">
            <svg class="provider-icon" viewBox="0 0 48 48" aria-hidden="true">
              <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" transform="translate(0 5)"/>
              <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.77 7.18l7.73 6C44.41 38.05 46.98 31.9 46.98 24.55z" transform="translate(0 0)"/>
              <path fill="#FBBC05" d="M10.53 28.59a14.4 14.4 0 0 1-.75-4.59c0-1.59.27-3.13.75-4.59l-7.98-6.19A23.9 23.9 0 0 0 0 24c0 3.87.93 7.54 2.56 10.78l7.97-6.19z" transform="translate(0 0)"/>
              <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.9-5.8l-7.73-6c-2.14 1.44-4.89 2.3-8.17 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" transform="translate(0 -5)"/>
            </svg>
            <span>Continue with Google</span>
          </button>
          <button class="auth-button" id="microsoftBtn" type="button">
            <svg class="provider-icon microsoft-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="#F25022" d="M1 1h10v10H1z"/>
              <path fill="#7FBA00" d="M13 1h10v10H13z"/>
              <path fill="#00A4EF" d="M1 13h10v10H1z"/>
              <path fill="#FFB900" d="M13 13h10v10H13z"/>
            </svg>
            <span>Continue with Microsoft</span>
          </button>
          <button class="auth-button" id="appleBtn" type="button">
            <svg class="provider-icon apple-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M16.37 12.35c.02 2.16 1.9 2.88 1.92 2.89-.02.05-.3 1.03-.99 2.04-.59.87-1.2 1.73-2.16 1.75-.94.02-1.24-.57-2.31-.57-1.07 0-1.4.55-2.29.59-.92.04-1.62-.94-2.21-1.8-1.2-1.74-2.12-4.92-.89-7.07a3.42 3.42 0 0 1 2.87-1.75c.9-.02 1.75.62 2.31.62.55 0 1.59-.77 2.68-.66.46.02 1.75.19 2.58 1.41-.07.04-1.54.9-1.52 2.55ZM14.6 6.93a3.4 3.4 0 0 0 .78-2.43 3.48 3.48 0 0 0-2.24 1.15 3.22 3.22 0 0 0-.8 2.35 2.9 2.9 0 0 0 2.26-1.07Z"/>
            </svg>
            <span>Continue with Apple</span>
          </button>
        </div>
        <p class="auth-error" id="authError" role="alert" aria-live="polite"></p>
        <p class="login-terms">By signing in, you agree to our <a href="#terms">Terms</a>.</p>
      </section>
    </main>
    <div class="watermark">CREATOR AUNTARIK</div>
  </body>
</html>
